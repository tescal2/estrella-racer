<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e2a">
<title>Estrella Racer</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
    <header id="topBar">
      <button id="muteBtn" class="iconBtn">🔊</button>
    </header>

    <section id="menuPanel" class="panel menuStyle">
      <div class="logoWrap">
        <span class="logoStar">⭐</span>
        <h1 class="gameTitle">ESTRELLA RACER</h1>
        <span class="logoStar">⭐</span>
      </div>
      <button id="playBtn" class="bigPlay">🏁 Start 🏁</button>
    </section>

    <section id="selectPanel" class="panel hidden">
      <h2 class="secTitle">Choose Your Racer</h2>
      <div id="coinDisplay" class="coinBadge">🪙 0</div>
      <div class="driverRow">
        <button id="pickAxel" class="driverCard active">
          <div class="avatarWrap"><canvas id="avatarAxel" class="avatarCanvas" width="160" height="200"></canvas></div>
        </button>
        <button id="pickJade" class="driverCard">
          <div class="avatarWrap"><canvas id="avatarJade" class="avatarCanvas" width="160" height="200"></canvas></div>
        </button>
      </div>
      <div class="goldenRow">
        <button id="goldenAxel" class="goldenBtn">🔒 500 🪙</button>
        <button id="goldenJade" class="goldenBtn">🔒 500 🪙</button>
      </div>
      <div class="levelRow">
        <button id="level1" class="levelPill active">1️⃣ Chicago</button>
        <button id="level2" class="levelPill" disabled>🔒 Cosmic</button>
        <button id="level3" class="levelPill" disabled>🔒 Desert</button>
      </div>
      <div class="diffRow">
        <button id="diffEasy" class="diffPill" data-d="easy">🟢 Easy</button>
        <button id="diffMed" class="diffPill active" data-d="medium">🟡 Medium</button>
        <button id="diffHard" class="diffPill" data-d="hard">🔴 Hard</button>
      </div>
      <div class="modeRow">
        <button id="goRace" class="modeBtn race">🏁 RACE</button>
        <button id="goLoco" class="modeBtn loco">💥 LOCO</button>
      </div>
    </section>

    <section id="hud" class="hidden">
      <div id="hudRow">
        <span id="hudLives"></span>
        <span id="hudScore">⭐ 0</span>
      </div>
      <div id="progressWrap">
        <svg id="progressSvg" viewBox="0 0 300 30" preserveAspectRatio="none">
          <path id="progressBg" d="M5,25 C50,5 100,25 150,10 C200,-5 250,20 295,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
          <path id="progressPath" d="M5,25 C50,5 100,25 150,10 C200,-5 250,20 295,8" fill="none" stroke="url(#progGrad)" stroke-width="4" stroke-linecap="round"/>
          <defs><linearGradient id="progGrad"><stop offset="0%" stop-color="#ffe14d"/><stop offset="100%" stop-color="#ff6b35"/></linearGradient></defs>
          <circle id="progressDot" r="5" fill="#ffe14d" filter="url(#glow)"/>
          <text x="290" y="14" font-size="14" text-anchor="middle">🏁</text>
          <defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        </svg>
        <div id="progressLabel">0%</div>
      </div>
      <div id="hudFlash" class="hidden"></div>
      <div id="hudBtns">
        <button id="pauseBtn" class="iconBtn">⏸</button>
        <button id="exitBtn" class="iconBtn">🏠</button>
      </div>
    </section>

    <section id="resultPanel" class="panel hidden">
      <h2 id="resultTitle"></h2>
      <p id="resultMsg"></p>
      <p id="resultScore"></p>
      <button id="retryBtn" class="actionBtn">🔄 RETRY</button>
      <button id="backMenuBtn" class="backBtn">🏠 Menu</button>
    </section>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
